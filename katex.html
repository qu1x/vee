

<!-- KaTeX -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
	integrity="sha384-u1zONI5gPXUx0UKI62c75/zww972y0v2rSK5ZYlVdS6xEuWDeZWUI66v6t1gvlXJ" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"
	integrity="sha384-ykMNcWQhhTUb0YV9SPpPUFURHZ+tWmubkakGBP+OgNK/UXdO2gtzglWx0Rj9hnO3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/contrib/auto-render.min.js"
	integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
<script>
let tex = function() {
	const macros = {
		'\\e': '\\boldsymbol e',
		'\\I': '\\boldsymbol I',
	};
	let to_do = [];
	for (let e of document.getElementsByTagName("code")) {
		if (e.parentNode.classList.contains("language-gdef")) {
			to_do.push(function () {
				if (!e.hasAttribute("data-tex")) {
					e.setAttribute("data-tex", "true");
					let x = document.createElement('span');
					e.parentNode.parentNode.remove();
					katex.render(e.innerText, x, {displayMode: true, throwOnError: true, macros});
				}
			});
		} else if (e.parentNode.classList.contains("language-math")) {
			to_do.push(function () {
				if (!e.hasAttribute("data-tex")) {
					e.setAttribute("data-tex", "true");
					let x = document.createElement('span');
					e.parentNode.appendChild(x);
					katex.render(e.innerText, x, {displayMode: true, throwOnError: true, macros});
				}
			});
		} else {
			let n = e.nextSibling;
			let p = e.previousSibling;
			if (n && p && /^\$/.test(n.data) && /\$$/.test(p.data)) {
				to_do.push(function () {
					if (!e.hasAttribute("data-tex")) {
						e.setAttribute("data-tex", "true");
						let n = e.nextSibling;
						let p = e.previousSibling;
						let x = document.createElement('span');
						katex.render(e.innerText, x, {throwOnError: true, macros});
						e.parentNode.replaceChild(x, e);
						n.splitText(1);
						n.remove();
						p.splitText(p.data.length - 1).remove();
					}
				});
			}
		}
	}
	let t = function() { for (let f of to_do) f() };
	t();
	for (let i = 0; i < 8; i++)
		setTimeout(t, 100 * 2 ** i);
}
tex();
document.addEventListener("readystatechange", tex);
</script>
<style>
	.docblock > p {
		overflow-x: visible !important;
	}
	.katex {
		font-size: 1.0em !important;
	}
	.language-inline-math {
		background-color: transparent !important;
	}
	.language-math {
		background-color: transparent !important;
	}
	.language-math > code {
		display: none !important;
	}
</style>
